<title id="title">PACE, Asio and libuv — local Linux TCP echo comparison</title>
<desc id="description">PACE: 340,328 requests/s, p50 77.71, p95 157.01, p99 177.94 microseconds; Asio: 327,696 requests/s, p50 94.69, p95 109.53, p99 141.22 microseconds; libuv: 313,891 requests/s, p50 93.20, p95 179.80, p99 197.63 microseconds. All axes start at zero. This is one local workload, not an overall ranking.</desc>
