<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" fill="none" role="img" aria-labelledby="title description">
  <title id="title">PACE — Modern C++ networking, at your pace</title>
  <desc id="description">Dark project card with purple and mint accents. A request stream fans into three independent worker reactors. C++20 coroutines, TCP and HTTP, Linux, macOS, Windows and FreeBSD.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1280" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#101627"/><stop offset="1" stop-color="#080D18"/></linearGradient>
    <linearGradient id="accent" x1="80" y1="205" x2="520" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#DBE5FF"/><stop offset="0.65" stop-color="#A7A8FF"/><stop offset="1" stop-color="#7B8BFF"/></linearGradient>
    <linearGradient id="flow" x1="710" y1="320" x2="1000" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#677BDF" stop-opacity="0.2"/><stop offset="1" stop-color="#8E9BFF"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1070 135) rotate(130) scale(520 400)" gradientUnits="userSpaceOnUse"><stop stop-color="#6357C2" stop-opacity="0.22"/><stop offset="1" stop-color="#6357C2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#B1BBED" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="618" rx="28" fill="url(#surface)" stroke="#263149" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="616" rx="27" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="616" rx="27" fill="url(#glow)"/>

