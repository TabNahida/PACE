    <text x="68" y="254" fill="url(#accent)" font-size="140" font-weight="800" letter-spacing="-8">PACE</text>
    <text x="76" y="312" fill="#F0F3FF" font-size="30" font-weight="500" letter-spacing="-0.6">Modern networking.</text>
    <text x="76" y="354" fill="#F0F3FF" font-size="30" font-weight="500" letter-spacing="-0.6">Your threads. Your pace.</text>
    <text x="76" y="404" fill="#8997B4" font-size="17">Coroutines · TCP + HTTP · Independent reactors</text>

