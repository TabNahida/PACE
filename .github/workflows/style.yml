name: Code style
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pace-style-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned clang-format
        run: python -m pip install clang-format==22.1.8
      - name: Check that every C++ source is formatted
        run: python scripts/format.py --check
