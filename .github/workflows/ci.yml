name: Build, test and compare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pace-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.standard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        standard: [cxx20]
        include:
          - os: ubuntu-latest
            standard: cxx23
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'
          actions-cache-folder: '.xmake-cache'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: xmake f -m release --cxxstandard=${{ matrix.standard }} --benchmarks=y -y
      - name: Build
        run: xmake -y
      - name: Tests
        run: xmake test -v
      - name: Compare PACE, libuv and Asio
        run: python scripts/run_benchmarks.py --require-all --output benchmark-results/${{ matrix.os }}-${{ matrix.standard }}.json --repeats 3 --requests 2000 --warmup 200 --clients 4 --message-size 64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.standard }}
          path: benchmark-results/
          if-no-files-found: warn
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'
      - run: xmake f -m debug --sanitizers=y --examples=n -y
      - run: xmake -y
      - run: xmake test -v
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
  freebsd:
    name: FreeBSD 14 / C++20
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and benchmark in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          cache-after-prepare: true
          prepare: |
            pkg install -y python3 git pkgconf libuv asio gmake curl unzip gsed bash perl5
            git clone --recursive --depth 1 --branch v3.0.9 https://github.com/xmake-io/xmake.git /tmp/pace-xmake-source
            (cd /tmp/pace-xmake-source && ./configure && gmake -j4 && gmake install)
          run: |
            export XMAKE_ROOT=y
            xmake --version
            xmake f -m release --benchmarks=y -y
            xmake -y
            xmake test -v
            python3 scripts/run_benchmarks.py --require-all --output benchmark-results/freebsd.json --repeats 3 --requests 2000 --warmup 200 --clients 4 --message-size 64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-freebsd
          path: benchmark-results/
          if-no-files-found: warn
