name: Build and functional validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pace-ci-${{ github.ref }}
  cancel-in-progress: true
# Performance evidence is collected only on local Linux. CI runs bounded
# correctness checks and discards benchmark timings; it publishes no rankings.
jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.standard }} / supported protocols
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            standard: cxx20
            quic: 'y'
          - os: ubuntu-latest
            standard: cxx23
            quic: 'y'
          - os: macos-latest
            standard: cxx20
            quic: 'y'
          - os: windows-latest
            standard: cxx20
            quic: 'n'
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'
          actions-cache-folder: '.xmake-cache'
          package-cache: true
          package-cache-key: protocols-${{ matrix.os }}-${{ matrix.standard }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure all supported protocols, tutorials and benchmark executables
        run: xmake f -c -m release -o build/ci --cxxstandard=${{ matrix.standard }} --http1=y --websocket=y --tls=y --dns=y --http2=y --quic=${{ matrix.quic }} --http3=${{ matrix.quic }} --benchmarks=y --components=y --scaling=y --profiling=n --sanitizers=n --examples=y --tests=y -y
      - name: Build
        run: xmake -y
      - name: Run all supported protocol tests and tutorials
        run: xmake test -v
      - name: Verify WebSocket with independent Python peers
        run: python tests/websocket_interop.py --build-dir build/ci
      - name: Validate reporting code
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check benchmark payloads, counters and schemas (no performance report)
        run: python scripts/ci_smoke.py --build-dir build/ci --output ci-results/smoke.json
      - name: Configure instrumented runtime coverage
        run: xmake f -c -m release -o build/ci-profile --cxxstandard=${{ matrix.standard }} --http1=n --websocket=n --tls=n --dns=n --quic=n --http2=n --http3=n --benchmarks=y --components=n --scaling=n --profiling=y --sanitizers=n --examples=n --tests=y -y
      - name: Build instrumented runtime
        run: xmake -y
      - name: Test instrumented runtime
        run: xmake test -v
      - name: Check instrumentation schema (discard timing values)
        run: python scripts/ci_smoke.py --build-dir build/ci-profile --profile-only --output ci-results/profile-smoke.json
      - name: Verify Windows explicitly rejects unsupported QUIC and HTTP3
        if: runner.os == 'Windows'
        run: python scripts/ci_smoke.py --check-windows-quic-rejection --output ci-results/unsupported-protocols.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-validation-${{ matrix.os }}-${{ matrix.standard }}
          path: ci-results/
          if-no-files-found: warn
  sanitizers:
    name: Linux / all protocols / ASan + UBSan + leaks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'
          actions-cache-folder: '.xmake-cache'
          package-cache: true
          package-cache-key: sanitizers-ubuntu
      - name: Configure every protocol with sanitizers
        run: xmake f -c -m debug -o build/ci-sanitizers --cxxstandard=cxx20 --http1=y --websocket=y --tls=y --dns=y --quic=y --http2=y --http3=y --sanitizers=y --benchmarks=n --components=n --scaling=n --profiling=n --examples=y --tests=y -y
      - name: Build
        run: xmake -y
      - name: Run every protocol test and tutorial with sanitizer failures fatal
        run: xmake test -v
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
  protocol-layers:
    name: Linux / independent protocol layers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'
          actions-cache-folder: '.xmake-cache'
          package-cache: true
          package-cache-key: independent-protocols-ubuntu
      - name: Core with no optional protocols
        run: |
          xmake f -c -m release -o build/ci-core --cxxstandard=cxx20 --http1=n --websocket=n --tls=n --dns=n --quic=n --http2=n --http3=n --benchmarks=n --components=n --scaling=n --profiling=n --sanitizers=n --examples=y --tests=y -y
          xmake -y
          xmake test -v
      - name: HTTP3 without HTTP1, HTTP2 or TCP TLS
        run: |
          xmake f -c -m release -o build/ci-http3 --cxxstandard=cxx20 --http1=n --websocket=n --tls=n --dns=n --quic=n --http2=n --http3=y --benchmarks=n --components=n --scaling=n --profiling=n --sanitizers=n --examples=y --tests=y -y
          xmake -y
          xmake test -v
  freebsd:
    name: FreeBSD 14.3 / C++20 / all protocols
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build and functionally test every protocol in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          envs: GITHUB_SHA
          cache-after-prepare: true
          prepare: |
            set -eu
            pkg install -y python3 git pkgconf gmake cmake ninja curl unzip gsed bash perl5
            git clone --recursive --depth 1 --branch v3.0.9 https://github.com/xmake-io/xmake.git /tmp/pace-xmake-source
            (cd /tmp/pace-xmake-source && ./configure && gmake -j4 && gmake install)
          run: |
            set -eu
            export XMAKE_ROOT=y
            xmake --version
            xmake f -c -m release -o build/ci --cxxstandard=cxx20 --http1=y --websocket=y --tls=y --dns=y --quic=y --http2=y --http3=y --benchmarks=y --components=y --scaling=y --profiling=n --sanitizers=n --examples=y --tests=y -y
            xmake -y
            xmake test -v
            python3 tests/websocket_interop.py --build-dir build/ci
            python3 -m unittest discover -s tests -p "test_*.py"
            python3 scripts/ci_smoke.py --build-dir build/ci --output ci-results/smoke.json
            xmake f -c -m release -o build/ci-profile --cxxstandard=cxx20 --http1=n --websocket=n --tls=n --dns=n --quic=n --http2=n --http3=n --benchmarks=y --components=n --scaling=n --profiling=y --sanitizers=n --examples=n --tests=y -y
            xmake -y
            xmake test -v
            python3 scripts/ci_smoke.py --build-dir build/ci-profile --profile-only --output ci-results/profile-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-validation-freebsd-cxx20
          path: ci-results/
          if-no-files-found: warn
