name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pace-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Check and build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install the pinned mkdocs toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Check translations, structure, links and anchors
        run: python scripts/check_docs.py
      - name: Check that the README figures match their data
        run: python scripts/render_readme_figures.py --check
      - name: Build the site
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Publishing needs Pages enabled with "GitHub Actions" as its source (repository settings). Until then the
      # site is still built and checked above; this job only skips the upload.
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > build_type 2>/dev/null \
            && [ "$(cat build_type)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled with GitHub Actions as its source; skipping publication."
          fi
      - id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
