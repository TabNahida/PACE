name: QUIC backends and modern compilers
on:
  push:
    branches: [main, 'codex/quic-ngtcp2']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pace-quic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocols:
    runs-on: ubuntu-24.04
    container: ${{ matrix.compiler == 'gcc-16' && 'gcc:16.2' || '' }}
    env:
      XMAKE_ROOT: y
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-15, gcc-16, clang-21]
        backend: [openssl, ngtcp2]
    name: ${{ matrix.compiler }} / ${{ matrix.backend }} / C++20
    steps:
      - uses: actions/checkout@v4
      - name: Install selected GCC
        if: matrix.compiler == 'gcc-15'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          version="${{ matrix.compiler }}"
          version="${version#gcc-}"
          sudo apt-get install -y "g++-$version"
          echo "PACE_CC=gcc-$version" >> "$GITHUB_ENV"
          echo "PACE_CXX=g++-$version" >> "$GITHUB_ENV"
          echo 'PACE_TOOLCHAIN=gcc' >> "$GITHUB_ENV"
      - name: Select GCC 16.2 release compiler
        if: matrix.compiler == 'gcc-16'
        run: |
          apt-get update
          apt-get install -y sudo unzip cmake
          echo 'PACE_CC=gcc' >> "$GITHUB_ENV"
          echo 'PACE_CXX=g++' >> "$GITHUB_ENV"
          echo 'PACE_TOOLCHAIN=gcc' >> "$GITHUB_ENV"
      - name: Install Clang 21 and matching module scanner
        if: matrix.compiler == 'clang-21'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y clang-tools-21
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
          echo 'PACE_CC=clang-21' >> "$GITHUB_ENV"
          echo 'PACE_CXX=clang++-21' >> "$GITHUB_ENV"
          echo 'PACE_TOOLCHAIN=clang' >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
          actions-cache-folder: '.xmake-cache'
          package-cache: true
          package-cache-key: quic-${{ matrix.compiler }}-${{ matrix.backend }}
      - name: Record compiler versions
        run: |
          "$PACE_CXX" --version
          xmake --version
      - name: Configure all protocols
        run: xmake f -c -m release --toolchain="$PACE_TOOLCHAIN" --cc="$PACE_CC" --cxx="$PACE_CXX" --ld="$PACE_CXX" --cxxstandard=cxx20 --quic_backend=${{ matrix.backend }} --http1=y --websocket=y --tls=y --dns=y --quic=y --http2=y --http3=y --tests=y --examples=y -y
      - name: Build
        run: xmake -y
      - name: Test protocols and tutorials
        run: xmake test -v
      - uses: actions/upload-artifact@v4
        if: matrix.compiler == 'clang-21'
        with:
          name: quic-peer-${{ matrix.compiler }}-${{ matrix.backend }}
          path: build/linux/x86_64/release/pace_quic_tests
          if-no-files-found: error
      # GCC 15 ICEs in expand_CO_FRAME when importing inline coroutines.
      # GCC 16 contains the upstream coroutine/module serialization fix.
      - name: Build named module with all protocols
        if: matrix.compiler != 'gcc-15'
        run: |
          xmake f -c -m release --toolchain="$PACE_TOOLCHAIN" --cc="$PACE_CC" --cxx="$PACE_CXX" --ld="$PACE_CXX" --modules=y --cxxstandard=cxx20 --quic_backend=${{ matrix.backend }} --http1=y --websocket=y --tls=y --dns=y --quic=y --http2=y --http3=y --tests=y --examples=n -y
          xmake -v -y pace_module_tests
      - name: Test module ABI against header consumer
        if: matrix.compiler != 'gcc-15'
        run: xmake run pace_module_tests

  interoperability:
    needs: protocols
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quic-peer-clang-21-*
          path: peers
      - name: Exchange payloads between different backends in both directions
        run: |
          chmod +x peers/*/pace_quic_tests
          python3 tests/quic_backend_interop.py peers/quic-peer-clang-21-openssl/pace_quic_tests peers/quic-peer-clang-21-ngtcp2/pace_quic_tests
